resource_types:
- name: github-pr
  type: docker-image
  source:
    repository: teliaoss/github-pr-resource

resources:
- name: pull-request
  type: github-pr
  source:
    repository: https://github.com/MMahendravarman/concourse-ci-demo
    access_token: ((github-token))
    disable_ci_skip: true

jobs:
- name: pr-check
  plan:
    - get: pull-request
      trigger: true
      version: every

    - task: build-and-check-coverage
      config:
        platform: linux
        image_resource:
          type: registry-image
          source: {repository: maven, tag: '3.8.7-openjdk-17'}
        inputs:
          - name: pull-request
        params:
          GITHUB_TOKEN: ((github-token))
        run:
          path: bash
          args:
            - -exc
            - |
              cd pull-request
              mvn clean verify             
              chmod +x scripts/check_coverage.sh
              ./scripts/check_coverage.sh